name: Academy integration QA
on:
  push:
    branches:
      - qa/ADU-228-229-academy-integration
permissions:
  contents: read
jobs:
  editorial-and-java:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run test:taxonomy
      - run: npm run validate:content
      - run: npm run validate:taxonomy
      - run: npm run test:java-examples
