name: Handbook executable examples
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'examples/java/handbook/**'
      - 'src/content/docs/handbook/**'
      - 'scripts/*java*.mjs'
      - 'scripts/verify-maven-reports.py'
      - '.github/workflows/handbook-java.yml'
      - 'package.json'
  push:
    branches: [master, feature/ADU-236-executable-examples]
    paths:
      - 'examples/java/handbook/**'
      - 'src/content/docs/handbook/**'
      - 'scripts/*java*.mjs'
      - 'scripts/verify-maven-reports.py'
      - '.github/workflows/handbook-java.yml'
      - 'package.json'
permissions:
  contents: read
jobs:
  executable-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Record toolchain versions
        run: |
          node --version
          java -version
          javac -version
      - name: Verify canonical snippet synchronization
        run: node scripts/sync-java-snippets.mjs
      - name: Test compiler diagnostic parser
        run: node --test scripts/test-java-compiler-diagnostics.mjs
      - name: Compile and execute canonical sources
        run: node scripts/test-java-sources.mjs
      - name: Run historical executable examples
        run: node scripts/test-java-examples.mjs
  maven-json-junit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Record Maven toolchain
        run: mvn -version
      - name: Run real library and JUnit tests
        run: |
          mvn -B -ntp -f examples/java/handbook/maven/json-junit/pom.xml clean test
          python3 scripts/verify-maven-reports.py examples/java/handbook/maven/json-junit/target/surefire-reports normal
      - name: Prove the range test detects regression
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          cp examples/java/handbook/maven/json-junit/pom.xml "$work/"
          cp -R examples/java/handbook/maven/json-junit/src "$work/"
          python3 -c 'from pathlib import Path; import sys; p=Path(sys.argv[1]); s=p.read_text(); old="return (long) maximo - minimo;"; assert s.count(old)==1; p.write_text(s.replace(old,"return 0L;"))' "$work/src/main/java/Rango.java"
          if mvn -B -ntp -f "$work/pom.xml" -Dtest=RangoTest test; then
            echo "Deliberate regression unexpectedly passed"
            exit 1
          fi
          python3 scripts/verify-maven-reports.py "$work/target/surefire-reports" mutation
  maven-javafx:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgtk-3-0t64
          mvn -version
      - name: Test JavaFX runtime on virtual display
        run: xvfb-run -a mvn -B -ntp -f examples/java/handbook/maven/javafx/pom.xml clean test
      - name: Verify exact runtime test results
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = ET.parse(Path('examples/java/handbook/maven/javafx/target/surefire-reports/TEST-FxRuntimeTest.xml')).getroot()
          expected = {'ventanaMinima','eventosDemo','accionYListeners','listaObservable','bindings','filtroOrdenYFuente','columnaObservaPropiedad','cargaFxmlEInyeccion','sceneBuilderFxml','navegarYVolver'}
          cases = root.findall('testcase')
          assert len(cases) == len(expected) and {c.attrib['name'] for c in cases} == expected
          assert all(c.find(tag) is None for c in cases for tag in ('failure','error','skipped'))
          print('JavaFX runtime: 10/10 PASS')
          PY
