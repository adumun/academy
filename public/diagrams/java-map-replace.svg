<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="t d"><title id="t">Una clave, una asociación</title><desc id="d">Map contiene A igual a 10 y B igual a 20. put A,15 reemplaza el valor asociado a A sin crear una tercera entrada.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#405a70"/></marker></defs><rect width="720" height="300" rx="16" fill="#f7fafc"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="24" y="32" font-size="21" font-weight="700">Una clave, una asociación</text><path d="M284 110L436 110" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><path d="M360 210L360 145" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><rect x="24" y="65" width="260" height="90" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="154" y="104.5" text-anchor="middle" font-size="18" font-weight="700">Antes</text><text x="154" y="127.5" text-anchor="middle" font-size="15" font-weight="400">A → 10; B → 20</text><rect x="436" y="65" width="260" height="90" rx="10" fill="#d6f5e9" stroke="#197658" stroke-width="1.5"/><text x="566" y="104.5" text-anchor="middle" font-size="18" font-weight="700">Después</text><text x="566" y="127.5" text-anchor="middle" font-size="15" font-weight="400">A → 15; B → 20</text><rect x="230" y="210" width="260" height="64" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="360" y="236.5" text-anchor="middle" font-size="18" font-weight="700">put("A", 15)</text><text x="360" y="259.5" text-anchor="middle" font-size="15" font-weight="400">devuelve 10</text></g></svg>
