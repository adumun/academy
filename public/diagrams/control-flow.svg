<svg xmlns="http://www.w3.org/2000/svg" width="720" height="352" viewBox="0 0 720 352" role="img" aria-labelledby="t d"><title id="t">Decidir y repetir</title><desc id="d">El algoritmo lee cada valor, suma solo los positivos y vuelve a revisar si quedan elementos; cuando no quedan, muestra el total.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#405a70"/></marker></defs><rect width="720" height="352" rx="16" fill="#f7fafc"/><g font-family="system-ui, sans-serif" fill="#183149"><text x="24" y="32" font-size="21" font-weight="700">Decidir y repetir</text><path d="M465 81 L520 81" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#arrow)"/><text x="492.5" y="73" text-anchor="middle" font-size="14" paint-order="stroke" stroke="#f7fafc" stroke-width="5" fill="#334e64">no</text><path d="M360 105 L360 131" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#arrow)"/><text x="360" y="110" text-anchor="middle" font-size="14" paint-order="stroke" stroke="#f7fafc" stroke-width="5" fill="#334e64">sí</text><path d="M360 179 L360 205" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M360 253 L360 279" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#arrow)"/><text x="360" y="258" text-anchor="middle" font-size="14" paint-order="stroke" stroke="#f7fafc" stroke-width="5" fill="#334e64">sí</text><path d="M255 229 L198 229" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#arrow)"/><text x="226.5" y="221" text-anchor="middle" font-size="14" paint-order="stroke" stroke="#f7fafc" stroke-width="5" fill="#334e64">no</text><path d="M255 303 L111 253" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M111 205 L255 81" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="255" y="57" width="210" height="48" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.6"/><text x="360" y="87" text-anchor="middle" font-size="18" font-weight="700">¿Quedan valores?</text><rect x="255" y="131" width="210" height="48" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.6"/><text x="360" y="161" text-anchor="middle" font-size="18" font-weight="700">Leer siguiente</text><rect x="255" y="205" width="210" height="48" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.6"/><text x="360" y="235" text-anchor="middle" font-size="18" font-weight="700">¿Es positivo?</text><rect x="255" y="279" width="210" height="48" rx="10" fill="#d6f5e9" stroke="#197658" stroke-width="1.6"/><text x="360" y="309" text-anchor="middle" font-size="18" font-weight="700">Sumar al total</text><rect x="520" y="57" width="172" height="48" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.6"/><text x="606" y="87" text-anchor="middle" font-size="18" font-weight="700">Mostrar total</text><rect x="24" y="205" width="174" height="48" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.6"/><text x="111" y="235" text-anchor="middle" font-size="18" font-weight="700">Siguiente vuelta</text></g></svg>
