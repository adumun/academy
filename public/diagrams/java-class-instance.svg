<svg xmlns="http://www.w3.org/2000/svg" width="720" height="315" viewBox="0 0 720 315" role="img" aria-labelledby="title desc"><title id="title">Una clase, instancias distintas</title><desc id="desc">La clase Libro declara id y titulo y un constructor. Dos invocaciones de new crean dos instancias con sus propios valores.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#405a70"/></marker></defs><rect width="720" height="315" rx="16" fill="#f7fafc"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="24" y="32" font-size="21" font-weight="700">Una clase, instancias distintas</text><path d="M305 149L169 210" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><text x="237" y="171.5" text-anchor="middle" font-size="14" paint-order="stroke" stroke="#f7fafc" stroke-width="5">new</text><path d="M415 149L551 210" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><text x="483" y="171.5" text-anchor="middle" font-size="14" paint-order="stroke" stroke="#f7fafc" stroke-width="5">new</text><rect x="240" y="55" width="240" height="94" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="360" y="85" text-anchor="middle" font-size="18" font-weight="700">Clase Libro</text><text x="360" y="108" text-anchor="middle" font-size="15" font-weight="400">id, titulo</text><text x="360" y="131" text-anchor="middle" font-size="15" font-weight="400">constructor / getters</text><rect x="24" y="210" width="290" height="78" rx="10" fill="#d6f5e9" stroke="#197658" stroke-width="1.5"/><text x="169" y="243.5" text-anchor="middle" font-size="18" font-weight="700">Objeto 1</text><text x="169" y="266.5" text-anchor="middle" font-size="15" font-weight="400">id = 1, titulo = Java</text><rect x="406" y="210" width="290" height="78" rx="10" fill="#d6f5e9" stroke="#197658" stroke-width="1.5"/><text x="551" y="243.5" text-anchor="middle" font-size="18" font-weight="700">Objeto 2</text><text x="551" y="266.5" text-anchor="middle" font-size="15" font-weight="400">id = 2, titulo = SQL</text></g></svg>
