<svg xmlns="http://www.w3.org/2000/svg" width="720" height="305" viewBox="0 0 720 305" role="img" aria-labelledby="title desc"><title id="title">Inicializar antes de usar</title><desc id="desc">new ConstructorDemo(10) delega al constructor de dos argumentos mediante this(0, 10); este valida los límites, inicializa campos y permite utilizar el objeto.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#405a70"/></marker></defs><rect width="720" height="305" rx="16" fill="#f7fafc"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="24" y="32" font-size="21" font-weight="700">Inicializar antes de usar</text><path d="M234 109L255 109" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><path d="M465 109L486 109" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><path d="M591 151L591 209" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><path d="M486 246L234 246" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><rect x="24" y="67" width="210" height="84" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="129" y="103.5" text-anchor="middle" font-size="18" font-weight="700">new ConstructorDemo</text><text x="129" y="126.5" text-anchor="middle" font-size="15" font-weight="400">argumento 10</text><rect x="255" y="67" width="210" height="84" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="360" y="103.5" text-anchor="middle" font-size="18" font-weight="700">this(0, 10)</text><text x="360" y="126.5" text-anchor="middle" font-size="15" font-weight="400">delegación</text><rect x="486" y="67" width="210" height="84" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="591" y="103.5" text-anchor="middle" font-size="18" font-weight="700">Validar</text><text x="591" y="126.5" text-anchor="middle" font-size="15" font-weight="400">mínimo ≤ máximo</text><rect x="486" y="209" width="210" height="75" rx="10" fill="#d6f5e9" stroke="#197658" stroke-width="1.5"/><text x="591" y="241" text-anchor="middle" font-size="18" font-weight="700">Inicializar</text><text x="591" y="264" text-anchor="middle" font-size="15" font-weight="400">minimo=0, maximo=10</text><rect x="24" y="209" width="210" height="75" rx="10" fill="#d6f5e9" stroke="#197658" stroke-width="1.5"/><text x="129" y="241" text-anchor="middle" font-size="18" font-weight="700">Objeto listo</text><text x="129" y="264" text-anchor="middle" font-size="15" font-weight="400">amplitud() = 10</text></g></svg>
