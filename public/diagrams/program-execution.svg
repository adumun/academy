<svg xmlns="http://www.w3.org/2000/svg" width="720" height="284" viewBox="0 0 720 284" role="img" aria-labelledby="t d"><title id="t">Del problema al resultado</title><desc id="d">El problema se expresa como algoritmo; el código implementa el algoritmo y el entorno lo ejecuta con entradas para producir resultados.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#405a70"/></marker></defs><rect width="720" height="284" rx="16" fill="#f7fafc"/><g font-family="system-ui, sans-serif" fill="#183149"><text x="24" y="32" font-size="21" font-weight="700">Del problema al resultado</text><path d="M218 102 L263 102" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M457 102 L502 102" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M599 134 L457 192" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M218 224 L263 224" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M457 224 L502 224" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="24" y="70" width="194" height="64" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.6"/><text x="121" y="96.5" text-anchor="middle" font-size="18" font-weight="700">Problema</text><text x="121" y="119.5" text-anchor="middle" font-size="15" font-weight="400">qué resolver</text><rect x="263" y="70" width="194" height="64" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.6"/><text x="360" y="96.5" text-anchor="middle" font-size="18" font-weight="700">Algoritmo</text><text x="360" y="119.5" text-anchor="middle" font-size="15" font-weight="400">cómo resolverlo</text><rect x="502" y="70" width="194" height="64" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.6"/><text x="599" y="96.5" text-anchor="middle" font-size="18" font-weight="700">Código fuente</text><text x="599" y="119.5" text-anchor="middle" font-size="15" font-weight="400">implementación</text><rect x="263" y="192" width="194" height="64" rx="10" fill="#d6f5e9" stroke="#197658" stroke-width="1.6"/><text x="360" y="218.5" text-anchor="middle" font-size="18" font-weight="700">Ejecución</text><text x="360" y="241.5" text-anchor="middle" font-size="15" font-weight="400">entorno + código</text><rect x="24" y="192" width="194" height="64" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.6"/><text x="121" y="218.5" text-anchor="middle" font-size="18" font-weight="700">Entrada</text><text x="121" y="241.5" text-anchor="middle" font-size="15" font-weight="400">datos</text><rect x="502" y="192" width="194" height="64" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.6"/><text x="599" y="218.5" text-anchor="middle" font-size="18" font-weight="700">Resultado</text><text x="599" y="241.5" text-anchor="middle" font-size="15" font-weight="400">salida y efectos</text></g></svg>
