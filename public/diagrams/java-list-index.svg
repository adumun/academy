<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="t d"><title id="t">Índices y desplazamiento</title><desc id="d">Una lista con A, B, C tiene índices 0, 1 y 2. Al eliminar B en índice 1, C pasa al índice 1. El tamaño cambia de 3 a 2.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#405a70"/></marker></defs><rect width="720" height="300" rx="16" fill="#f7fafc"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="24" y="32" font-size="21" font-weight="700">Índices y desplazamiento</text><path d="M129 135L129 208" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><path d="M591 135L360 208" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><text x="475.5" y="163.5" text-anchor="middle" font-size="14" paint-order="stroke" stroke="#f7fafc" stroke-width="5">desplazar</text><rect x="24" y="70" width="210" height="65" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="129" y="108.5" text-anchor="middle" font-size="18" font-weight="700">0: A</text><rect x="255" y="70" width="210" height="65" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="360" y="108.5" text-anchor="middle" font-size="18" font-weight="700">1: B</text><rect x="486" y="70" width="210" height="65" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="591" y="108.5" text-anchor="middle" font-size="18" font-weight="700">2: C</text><rect x="24" y="208" width="210" height="65" rx="10" fill="#d6f5e9" stroke="#197658" stroke-width="1.5"/><text x="129" y="246.5" text-anchor="middle" font-size="18" font-weight="700">0: A</text><rect x="255" y="208" width="210" height="65" rx="10" fill="#d6f5e9" stroke="#197658" stroke-width="1.5"/><text x="360" y="246.5" text-anchor="middle" font-size="18" font-weight="700">1: C</text></g></svg>
