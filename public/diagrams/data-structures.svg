<svg xmlns="http://www.w3.org/2000/svg" width="720" height="265" viewBox="0 0 720 265" role="img" aria-labelledby="t d"><title id="t">La misma información, tres estructuras</title><desc id="d">La secuencia conserva tres posiciones con valores 10, 10 y 12. El conjunto contiene solo 10 y 12. El mapa asocia A con 10, B con 10 y C con 12.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#405a70"/></marker></defs><rect width="720" height="265" rx="16" fill="#f7fafc"/><g font-family="system-ui, sans-serif" fill="#183149"><text x="24" y="32" font-size="21" font-weight="700">La misma información, tres estructuras</text><rect x="24" y="68" width="210" height="164" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.6"/><text x="129" y="121.5" text-anchor="middle" font-size="18" font-weight="700">Secuencia</text><text x="129" y="144.5" text-anchor="middle" font-size="15" font-weight="400">0: 10</text><text x="129" y="167.5" text-anchor="middle" font-size="15" font-weight="400">1: 10</text><text x="129" y="190.5" text-anchor="middle" font-size="15" font-weight="400">2: 12</text><rect x="255" y="68" width="210" height="164" rx="10" fill="#d6f5e9" stroke="#197658" stroke-width="1.6"/><text x="360" y="133" text-anchor="middle" font-size="18" font-weight="700">Conjunto</text><text x="360" y="156" text-anchor="middle" font-size="15" font-weight="400">10</text><text x="360" y="179" text-anchor="middle" font-size="15" font-weight="400">12</text><rect x="486" y="68" width="210" height="164" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.6"/><text x="591" y="121.5" text-anchor="middle" font-size="18" font-weight="700">Asociación</text><text x="591" y="144.5" text-anchor="middle" font-size="15" font-weight="400">A → 10</text><text x="591" y="167.5" text-anchor="middle" font-size="15" font-weight="400">B → 10</text><text x="591" y="190.5" text-anchor="middle" font-size="15" font-weight="400">C → 12</text></g></svg>
