<svg xmlns="http://www.w3.org/2000/svg" width="720" height="315" viewBox="0 0 720 315" role="img" aria-labelledby="t d"><title id="t">Token numérico y resto de línea</title><desc id="d">nextInt consume 21 pero deja el separador de línea. nextLine consume el resto vacío; una segunda nextLine lee Sol.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#405a70"/></marker></defs><rect width="720" height="315" rx="16" fill="#f7fafc"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="24" y="32" font-size="21" font-weight="700">Token numérico y resto de línea</text><path d="M234 112L255 112" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><path d="M465 112L486 112" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><path d="M591 160L591 218" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><rect x="24" y="65" width="210" height="95" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="129" y="107" text-anchor="middle" font-size="18" font-weight="700">Entrada</text><text x="129" y="130" text-anchor="middle" font-size="15" font-weight="400">21 ↵ Sol ↵</text><rect x="255" y="65" width="210" height="95" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="360" y="95.5" text-anchor="middle" font-size="18" font-weight="700">nextInt()</text><text x="360" y="118.5" text-anchor="middle" font-size="15" font-weight="400">retorna 21</text><text x="360" y="141.5" text-anchor="middle" font-size="15" font-weight="400">queda ↵ Sol ↵</text><rect x="486" y="65" width="210" height="95" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="591" y="95.5" text-anchor="middle" font-size="18" font-weight="700">nextLine()</text><text x="591" y="118.5" text-anchor="middle" font-size="15" font-weight="400">retorna vacío</text><text x="591" y="141.5" text-anchor="middle" font-size="15" font-weight="400">queda Sol ↵</text><rect x="486" y="218" width="210" height="70" rx="10" fill="#d6f5e9" stroke="#197658" stroke-width="1.5"/><text x="591" y="247.5" text-anchor="middle" font-size="18" font-weight="700">nextLine()</text><text x="591" y="270.5" text-anchor="middle" font-size="15" font-weight="400">retorna Sol</text></g></svg>
