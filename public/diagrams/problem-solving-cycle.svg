<svg xmlns="http://www.w3.org/2000/svg" width="720" height="305" viewBox="0 0 720 305" role="img" aria-labelledby="t d"><title id="t">Del problema a la comprobación</title><desc id="d">Se transforma una necesidad en contrato, algoritmo y prueba. Un resultado distinto del esperado obliga a revisar la hipótesis o la implementación.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#405a70"/></marker></defs><rect width="720" height="305" rx="16" fill="#f7fafc"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="24" y="32" font-size="21" font-weight="700">Del problema a la comprobación</text><path d="M234 102L255 102" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><path d="M465 102L486 102" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><path d="M591 142L591 207" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><path d="M486 242L465 242" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><path d="M255 242L234 242" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><rect x="24" y="62" width="210" height="80" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="129" y="96.5" text-anchor="middle" font-size="18" font-weight="700">Necesidad</text><text x="129" y="119.5" text-anchor="middle" font-size="15" font-weight="400">qué se requiere</text><rect x="255" y="62" width="210" height="80" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="360" y="96.5" text-anchor="middle" font-size="18" font-weight="700">Contrato</text><text x="360" y="119.5" text-anchor="middle" font-size="15" font-weight="400">entradas y reglas</text><rect x="486" y="62" width="210" height="80" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="591" y="96.5" text-anchor="middle" font-size="18" font-weight="700">Algoritmo</text><text x="591" y="119.5" text-anchor="middle" font-size="15" font-weight="400">pasos</text><rect x="486" y="207" width="210" height="70" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="591" y="248" text-anchor="middle" font-size="18" font-weight="700">Implementación</text><rect x="255" y="207" width="210" height="70" rx="10" fill="#d6f5e9" stroke="#197658" stroke-width="1.5"/><text x="360" y="236.5" text-anchor="middle" font-size="18" font-weight="700">Prueba</text><text x="360" y="259.5" text-anchor="middle" font-size="15" font-weight="400">esperado vs real</text><rect x="24" y="207" width="210" height="70" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="129" y="236.5" text-anchor="middle" font-size="18" font-weight="700">Revisar</text><text x="129" y="259.5" text-anchor="middle" font-size="15" font-weight="400">si difiere</text></g></svg>
