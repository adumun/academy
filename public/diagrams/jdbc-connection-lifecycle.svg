<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" role="img" aria-labelledby="t d"><title id="t">Ciclo de vida de una conexión</title><desc id="d">El programa solicita una conexión a DriverManager; el driver negocia con el servidor y devuelve una sesión lógica. Las sentencias usan la conexión y close libera o devuelve recursos.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#405a70"/></marker></defs><rect width="720" height="310" rx="16" fill="#f7fafc"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="24" y="32" font-size="21" font-weight="700">Ciclo de vida de una conexión</text><path d="M234 107L255 107" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><path d="M465 107L486 107" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><path d="M591 146L465 202" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><path d="M255 241L234 241" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><rect x="24" y="68" width="210" height="78" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="129" y="101.5" text-anchor="middle" font-size="18" font-weight="700">Aplicación</text><text x="129" y="124.5" text-anchor="middle" font-size="15" font-weight="400">getConnection()</text><rect x="255" y="68" width="210" height="78" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="360" y="101.5" text-anchor="middle" font-size="18" font-weight="700">Driver JDBC</text><text x="360" y="124.5" text-anchor="middle" font-size="15" font-weight="400">protocolo del motor</text><rect x="486" y="68" width="210" height="78" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="591" y="101.5" text-anchor="middle" font-size="18" font-weight="700">Servidor</text><text x="591" y="124.5" text-anchor="middle" font-size="15" font-weight="400">autenticar sesión</text><rect x="255" y="202" width="210" height="78" rx="10" fill="#d6f5e9" stroke="#197658" stroke-width="1.5"/><text x="360" y="235.5" text-anchor="middle" font-size="18" font-weight="700">Connection</text><text x="360" y="258.5" text-anchor="middle" font-size="15" font-weight="400">preparar / ejecutar</text><rect x="24" y="202" width="210" height="78" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="129" y="235.5" text-anchor="middle" font-size="18" font-weight="700">close()</text><text x="129" y="258.5" text-anchor="middle" font-size="15" font-weight="400">liberar o devolver</text></g></svg>
