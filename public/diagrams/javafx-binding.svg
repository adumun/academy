<svg xmlns="http://www.w3.org/2000/svg" width="720" height="315" viewBox="0 0 720 315" role="img" aria-labelledby="t d"><title id="t">Un binding no es una copia</title><desc id="d">El origen A cambia de Java a JavaFX y el destino B sigue ese cambio mientras está enlazado. Al ejecutar unbind, B conserva el último valor y puede cambiar independientemente.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#405a70"/></marker></defs><rect width="720" height="315" rx="16" fill="#f7fafc"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="24" y="32" font-size="21" font-weight="700">Un binding no es una copia</text><path d="M284 104L436 104" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><text x="360" y="96" text-anchor="middle" font-size="14" paint-order="stroke" stroke="#f7fafc" stroke-width="5">bind</text><path d="M284 249L436 249" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><text x="360" y="241" text-anchor="middle" font-size="14" paint-order="stroke" stroke="#f7fafc" stroke-width="5">sin vínculo</text><rect x="24" y="65" width="260" height="78" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="154" y="98.5" text-anchor="middle" font-size="18" font-weight="700">Origen A</text><text x="154" y="121.5" text-anchor="middle" font-size="15" font-weight="400">Java → JavaFX</text><rect x="436" y="65" width="260" height="78" rx="10" fill="#d6f5e9" stroke="#197658" stroke-width="1.5"/><text x="566" y="98.5" text-anchor="middle" font-size="18" font-weight="700">Destino B</text><text x="566" y="121.5" text-anchor="middle" font-size="15" font-weight="400">Java → JavaFX</text><rect x="24" y="210" width="260" height="78" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="154" y="243.5" text-anchor="middle" font-size="18" font-weight="700">Origen A</text><text x="154" y="266.5" text-anchor="middle" font-size="15" font-weight="400">otro valor</text><rect x="436" y="210" width="260" height="78" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="566" y="243.5" text-anchor="middle" font-size="18" font-weight="700">Destino B</text><text x="566" y="266.5" text-anchor="middle" font-size="15" font-weight="400">valor independiente</text></g></svg>
