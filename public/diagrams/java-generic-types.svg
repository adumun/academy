<svg xmlns="http://www.w3.org/2000/svg" width="720" height="315" viewBox="0 0 720 315" role="img" aria-labelledby="t d"><title id="t">Un tipo genérico, varios usos</title><desc id="d">Caja declara un parámetro T. Caja de String acepta texto y Caja de Integer acepta enteros envueltos; el compilador comprueba los tipos.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#405a70"/></marker></defs><rect width="720" height="315" rx="16" fill="#f7fafc"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="24" y="32" font-size="21" font-weight="700">Un tipo genérico, varios usos</text><path d="M305 139L159 210" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><text x="232" y="166.5" text-anchor="middle" font-size="14" paint-order="stroke" stroke="#f7fafc" stroke-width="5">T = String</text><path d="M415 139L561 210" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><text x="488" y="166.5" text-anchor="middle" font-size="14" paint-order="stroke" stroke="#f7fafc" stroke-width="5">T = Integer</text><rect x="245" y="55" width="230" height="84" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="360" y="80" text-anchor="middle" font-size="18" font-weight="700">Caja&lt;T&gt;</text><text x="360" y="103" text-anchor="middle" font-size="15" font-weight="400">T valor</text><text x="360" y="126" text-anchor="middle" font-size="15" font-weight="400">T getValor()</text><rect x="24" y="210" width="270" height="80" rx="10" fill="#d6f5e9" stroke="#197658" stroke-width="1.5"/><text x="159" y="244.5" text-anchor="middle" font-size="18" font-weight="700">Caja&lt;String&gt;</text><text x="159" y="267.5" text-anchor="middle" font-size="15" font-weight="400">valor: Java</text><rect x="426" y="210" width="270" height="80" rx="10" fill="#d6f5e9" stroke="#197658" stroke-width="1.5"/><text x="561" y="244.5" text-anchor="middle" font-size="18" font-weight="700">Caja&lt;Integer&gt;</text><text x="561" y="267.5" text-anchor="middle" font-size="15" font-weight="400">valor: 21</text></g></svg>
