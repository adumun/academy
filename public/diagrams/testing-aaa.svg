<svg xmlns="http://www.w3.org/2000/svg" width="720" height="215" viewBox="0 0 720 215" role="img" aria-labelledby="t d"><title id="t">Preparar, actuar y comprobar</title><desc id="d">Una prueba prepara un estado conocido, ejecuta una operación y compara resultado observado con el esperado. Conserva evidencia del caso.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#405a70"/></marker></defs><rect width="720" height="215" rx="16" fill="#f7fafc"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="24" y="32" font-size="21" font-weight="700">Preparar, actuar y comprobar</text><path d="M234 125L255 125" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><path d="M465 125L486 125" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><rect x="24" y="75" width="210" height="100" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="129" y="108" text-anchor="middle" font-size="18" font-weight="700">Preparar</text><text x="129" y="131" text-anchor="middle" font-size="15" font-weight="400">estado inicial</text><text x="129" y="154" text-anchor="middle" font-size="15" font-weight="400">entrada</text><rect x="255" y="75" width="210" height="100" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="360" y="119.5" text-anchor="middle" font-size="18" font-weight="700">Actuar</text><text x="360" y="142.5" text-anchor="middle" font-size="15" font-weight="400">una operación</text><rect x="486" y="75" width="210" height="100" rx="10" fill="#d6f5e9" stroke="#197658" stroke-width="1.5"/><text x="591" y="119.5" text-anchor="middle" font-size="18" font-weight="700">Comprobar</text><text x="591" y="142.5" text-anchor="middle" font-size="15" font-weight="400">esperado vs real</text></g></svg>
