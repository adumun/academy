<svg xmlns="http://www.w3.org/2000/svg" width="720" height="295" viewBox="0 0 720 295" role="img" aria-labelledby="t d"><title id="t">Memoria, vista y almacenamiento</title><desc id="d">Una vista muestra el estado en memoria; guardar escribe una representación en almacenamiento; recuperar lee el almacenamiento y reconstruye el estado. La vista no garantiza que se guardó.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#405a70"/></marker></defs><rect width="720" height="295" rx="16" fill="#f7fafc"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="24" y="32" font-size="21" font-weight="700">Memoria, vista y almacenamiento</text><path d="M250 105L130 189" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><text x="190" y="139" text-anchor="middle" font-size="14" paint-order="stroke" stroke="#f7fafc" stroke-width="5">presentar</text><path d="M470 100L591 189" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><text x="530.5" y="136.5" text-anchor="middle" font-size="14" paint-order="stroke" stroke="#f7fafc" stroke-width="5">guardar</text><path d="M486 227L429 146" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><text x="457.5" y="178.5" text-anchor="middle" font-size="14" paint-order="stroke" stroke="#f7fafc" stroke-width="5">recuperar</text><rect x="250" y="64" width="220" height="82" rx="10" fill="#d6f5e9" stroke="#197658" stroke-width="1.5"/><text x="360" y="99.5" text-anchor="middle" font-size="18" font-weight="700">Estado en memoria</text><text x="360" y="122.5" text-anchor="middle" font-size="15" font-weight="400">objetos / valores</text><rect x="24" y="189" width="210" height="77" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="129" y="222" text-anchor="middle" font-size="18" font-weight="700">Vista</text><text x="129" y="245" text-anchor="middle" font-size="15" font-weight="400">representación visual</text><rect x="486" y="189" width="210" height="77" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="591" y="222" text-anchor="middle" font-size="18" font-weight="700">Almacenamiento</text><text x="591" y="245" text-anchor="middle" font-size="15" font-weight="400">archivo o base</text></g></svg>
