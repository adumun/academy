<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" role="img" aria-labelledby="t d"><title id="t">Colaborar por referencia</title><desc id="d">Circulo guarda una referencia a Punto y delega descripcion; no copia coordenadas. Punto también podría ser referenciado por otro consumidor.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#405a70"/></marker></defs><rect width="720" height="310" rx="16" fill="#f7fafc"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="24" y="32" font-size="21" font-weight="700">Colaborar por referencia</text><path d="M284 110L436 110" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><text x="360" y="102" text-anchor="middle" font-size="14" paint-order="stroke" stroke="#f7fafc" stroke-width="5">usa</text><path d="M284 245L436 155" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><text x="360" y="192" text-anchor="middle" font-size="14" paint-order="stroke" stroke="#f7fafc" stroke-width="5">referencia</text><rect x="24" y="65" width="260" height="90" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="154" y="104.5" text-anchor="middle" font-size="18" font-weight="700">Circulo</text><text x="154" y="127.5" text-anchor="middle" font-size="15" font-weight="400">campo centro</text><rect x="436" y="65" width="260" height="90" rx="10" fill="#d6f5e9" stroke="#197658" stroke-width="1.5"/><text x="566" y="104.5" text-anchor="middle" font-size="18" font-weight="700">Punto</text><text x="566" y="127.5" text-anchor="middle" font-size="15" font-weight="400">x = 0; y = 0</text><rect x="24" y="210" width="260" height="70" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="154" y="239.5" text-anchor="middle" font-size="18" font-weight="700">Otro consumidor</text><text x="154" y="262.5" text-anchor="middle" font-size="15" font-weight="400">referencia al mismo punto</text></g></svg>
