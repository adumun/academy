<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" role="img" aria-labelledby="t d"><title id="t">Depender de un contrato</title><desc id="d">Un consumidor usa el contrato de conversión; las implementaciones A y B cumplen ese contrato. El consumidor no depende directamente de sus detalles.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#405a70"/></marker></defs><rect width="720" height="290" rx="16" fill="#f7fafc"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="24" y="32" font-size="21" font-weight="700">Depender de un contrato</text><path d="M214 135L264 135" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><path d="M505 90L454 115" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><path d="M505 234L454 155" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><rect x="24" y="95" width="190" height="80" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="119" y="141" text-anchor="middle" font-size="18" font-weight="700">Consumidor</text><rect x="264" y="95" width="190" height="80" rx="10" fill="#d6f5e9" stroke="#197658" stroke-width="1.5"/><text x="359" y="129.5" text-anchor="middle" font-size="18" font-weight="700">Contrato</text><text x="359" y="152.5" text-anchor="middle" font-size="15" font-weight="400">entradas y salida</text><rect x="505" y="55" width="190" height="70" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="600" y="96" text-anchor="middle" font-size="18" font-weight="700">Implementación A</text><rect x="505" y="199" width="190" height="70" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="600" y="240" text-anchor="middle" font-size="18" font-weight="700">Implementación B</text></g></svg>
