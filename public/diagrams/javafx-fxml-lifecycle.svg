<svg xmlns="http://www.w3.org/2000/svg" width="720" height="305" viewBox="0 0 720 305" role="img" aria-labelledby="t d"><title id="t">FXMLLoader: construir y conectar</title><desc id="d">El cargador localiza el FXML, construye nodos y controlador, inyecta los campos y llama a initialize. El controlador puede atender eventos tras la carga.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#405a70"/></marker></defs><rect width="720" height="305" rx="16" fill="#f7fafc"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="24" y="32" font-size="21" font-weight="700">FXMLLoader: construir y conectar</text><path d="M234 102L255 102" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><path d="M465 102L486 102" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><path d="M591 140L591 205" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><path d="M486 242L234 242" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><rect x="24" y="65" width="210" height="75" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="129" y="97" text-anchor="middle" font-size="18" font-weight="700">Leer FXML</text><text x="129" y="120" text-anchor="middle" font-size="15" font-weight="400">ruta + XML</text><rect x="255" y="65" width="210" height="75" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="360" y="97" text-anchor="middle" font-size="18" font-weight="700">Construir</text><text x="360" y="120" text-anchor="middle" font-size="15" font-weight="400">nodos y Controller</text><rect x="486" y="65" width="210" height="75" rx="10" fill="#d6f5e9" stroke="#197658" stroke-width="1.5"/><text x="591" y="97" text-anchor="middle" font-size="18" font-weight="700">Inyectar</text><text x="591" y="120" text-anchor="middle" font-size="15" font-weight="400">fx:id → campos</text><rect x="486" y="205" width="210" height="75" 