<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="t d"><title id="t">Interacción y cambio de valor</title><desc id="d">Un clic genera ActionEvent e invoca un handler. Un cambio de texto notifica a ChangeListener con valor anterior y actual.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#405a70"/></marker></defs><rect width="720" height="300" rx="16" fill="#f7fafc"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="24" y="32" font-size="21" font-weight="700">Interacción y cambio de valor</text><path d="M234 103L255 103" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><path d="M465 103L486 103" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><path d="M234 237L255 237" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><path d="M465 237L486 237" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><rect x="24" y="65" width="210" height="75" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="129" y="97" text-anchor="middle" font-size="18" font-weight="700">Clic o teclado</text><text x="129" y="120" text-anchor="middle" font-size="15" font-weight="400">acción</text><rect x="255" y="65" width="210" height="75" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="360" y="108.5" text-anchor="middle" font-size="18" font-weight="700">ActionEvent</text><rect x="486" y="65" width="210" height="75" rx="10" fill="#d6f5e9" stroke="#197658" stroke-width="1.5"/><text x="591" y="97" text-anchor="middle" font-size="18" font-weight="700">EventHandler</text><text x="591" y="120" text-anchor="middle" font-size="15" font-weight="400">ejecuta acción</text><rect x="24" y="200" width="210" height="75" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="129" y="232" text-anchor="middle" font-size="18" font-weight="700">Texto cambia</text><text x="129" y="255" text-anchor="middle" font-size="15" font-weight="400">A → AB</text><rect x="255" y="200" width="210" height="75" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="360" y="243.5" text-anchor="middle" font-size="18" font-weight="700">StringProperty</text><rect x="486" y="200" width="210" height="75" rx="10" fill="#d6f5e9" stroke="#197658" stroke-width="1.5"/><text x="591" y="232" text-anchor="middle" font-size="18" font-weight="700">ChangeListener</text><text x="591" y="255" text-anchor="middle" font-size="15" font-weight="400">anterior A, actual AB</text></g></svg>
