<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-labelledby="t d"><title id="t">Invocar una operación</title><desc id="d">El llamador proporciona los argumentos 3 y 4 a una operación sumar; el contrato especifica parámetros y resultado, y la operación retorna 7.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#405a70"/></marker></defs><rect width="720" height="260" rx="16" fill="#f7fafc"/><g font-family="system-ui, sans-serif" fill="#183149"><text x="24" y="32" font-size="21" font-weight="700">Invocar una operación</text><path d="M205 148 L270 148" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M450 148 L515 148" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="25" y="92" width="180" height="112" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.6"/><text x="115" y="142.5" text-anchor="middle" font-size="18" font-weight="700">Llamador</text><text x="115" y="165.5" text-anchor="middle" font-size="15" font-weight="400">argumentos 3 y 4</text><rect x="270" y="68" width="180" height="160" rx="10" fill="#d6f5e9" stroke="#197658" stroke-width="1.6"/><text x="360" y="131" text-anchor="middle" font-size="18" font-weight="700">sumar(a, b)</text><text x="360" y="154" text-anchor="middle" font-size="15" font-weight="400">entrada: números</text><text x="360" y="177" text-anchor="middle" font-size="15" font-weight="400">resultado: suma</text><rect x="515" y="92" width="180" height="112" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.6"/><text x="605" y="142.5" text-anchor="middle" font-size="18" font-weight="700">Llamador</text><text x="605" y="165.5" text-anchor="middle" font-size="15" font-weight="400">recibe 7</text></g></svg>
