<svg xmlns="http://www.w3.org/2000/svg" width="720" height="345" viewBox="0 0 720 345" role="img" aria-labelledby="t d"><title id="t">Confirmar o revertir una unidad</title><desc id="d">Con auto-commit desactivado, dos cambios forman una unidad. Si ambos completan correctamente se confirma; si falla una operación, se revierte lo pendiente.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#405a70"/></marker></defs><rect width="720" height="345" rx="16" fill="#f7fafc"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="24" y="32" font-size="21" font-weight="700">Confirmar o revertir una unidad</text><path d="M360 110L360 141" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><path d="M295 196L141 245" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><text x="218" y="212.5" text-anchor="middle" font-size="14" paint-order="stroke" stroke="#f7fafc" stroke-width="5">fallo</text><path d="M425 196L578 245" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><text x="501.5" y="212.5" text-anchor="middle" font-size="14" paint-order="stroke" stroke="#f7fafc" stroke-width="5">éxito</text><rect x="245" y="55" width="230" height="55" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="360" y="88.5" text-anchor="middle" font-size="18" font-weight="700">Inicio: auto-commit off</text><rect x="245" y="141" width="230" height="55" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="360" y="174.5" text-anchor="middle" font-size="18" font-weight="700">Cambio 1 + cambio 2</text><rect x="24" y="245" width="235" height="70" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="141.5" y="274.5" text-anchor="middle" font-size="18" font-weight="700">ROLLBACK</text><text x="141.5" y="297.5" text-anchor="middle" font-size="15" font-weight="400">revertir pendientes</text><rect x="461" y="245" width="235" height="70" rx="10" fill="#d6f5e9" stroke="#197658" stroke-width="1.5"/><text x="578.5" y="274.5" text-anchor="middle" font-size="18" font-weight="700">COMMIT</text><text x="578.5" y="297.5" text-anchor="middle" font-size="15" font-weight="400">confirmar unidad</text></g></svg>
