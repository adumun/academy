<svg xmlns="http://www.w3.org/2000/svg" width="720" height="305" viewBox="0 0 720 305" role="img" aria-labelledby="t d"><title id="t">Nombre, tipo y valor</title><desc id="d">Una variable cantidad de tipo entero pasa de valor 3 a valor 5 al asignar el resultado de 3 más 2; el nombre y su tipo no cambian en este ejemplo.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#405a70"/></marker></defs><rect width="720" height="305" rx="16" fill="#f7fafc"/><g font-family="system-ui, sans-serif" fill="#183149"><text x="24" y="32" font-size="21" font-weight="700">Nombre, tipo y valor</text><path d="M301 134 L419 134" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#arrow)"/><text x="360" y="126" text-anchor="middle" font-size="14" paint-order="stroke" stroke="#f7fafc" stroke-width="5" fill="#334e64">asignar</text><path d="M360 224 L360 164" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="36" y="78" width="265" height="112" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.6"/><text x="168.5" y="128.5" text-anchor="middle" font-size="18" font-weight="700">cantidad : entero</text><text x="168.5" y="151.5" text-anchor="middle" font-size="15" font-weight="400">valor actual: 3</text><rect x="419" y="78" width="265" height="112" rx="10" fill="#d6f5e9" stroke="#197658" stroke-width="1.6"/><text x="551.5" y="128.5" text-anchor="middle" font-size="18" font-weight="700">cantidad : entero</text><text x="551.5" y="151.5" text-anchor="middle" font-size="15" font-weight="400">valor actual: 5</text><rect x="249" y="224" width="222" height="55" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.6"/><text x="360" y="257.5" text-anchor="middle" font-size="18" font-weight="700">3 + 2 = 5</text></g></svg>
