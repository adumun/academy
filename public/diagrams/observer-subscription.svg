<svg xmlns="http://www.w3.org/2000/svg" width="720" height="305" viewBox="0 0 720 305" role="img" aria-labelledby="t d"><title id="t">Suscribir, notificar y retirar</title><desc id="d">El sujeto conoce contratos de observadores A y B. Al cambiar notifica a ambos; al retirar B, solo A sigue registrado.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#405a70"/></marker></defs><rect width="720" height="305" rx="16" fill="#f7fafc"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="24" y="32" font-size="21" font-weight="700">Suscribir, notificar y retirar</text><path d="M254 106L436 92" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><text x="345" y="91" text-anchor="middle" font-size="14" paint-order="stroke" stroke="#f7fafc" stroke-width="5">notificar</text><path d="M254 145L436 245" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><text x="345" y="187" text-anchor="middle" font-size="14" paint-order="stroke" stroke="#f7fafc" stroke-width="5">notificar</text><rect x="24" y="75" width="230" height="94" rx="10" fill="#d6f5e9" stroke="#197658" stroke-width="1.5"/><text x="139" y="116.5" text-anchor="middle" font-size="18" font-weight="700">Sujeto</text><text x="139" y="139.5" text-anchor="middle" font-size="15" font-weight="400">estado y suscripciones</text><rect x="436" y="55" width="260" height="74" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="566" y="86.5" text-anchor="middle" font-size="18" font-weight="700">Observador A</text><text x="566" y="109.5" text-anchor="middle" font-size="15" font-weight="400">suscrito</text><rect x="436" y="208" width="260" height="74" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="566" y="239.5" text-anchor="middle" font-size="18" font-weight="700">Observador B</text><text x="566" y="262.5" text-anchor="middle" font-size="15" font-weight="400">suscrito</text></g></svg