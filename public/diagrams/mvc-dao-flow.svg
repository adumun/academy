<svg xmlns="http://www.w3.org/2000/svg" width="720" height="305" viewBox="0 0 720 305" role="img" aria-labelledby="t d"><title id="t">MVC, servicio y acceso a datos</title><desc id="d">La vista entrega eventos al controlador, que coordina un servicio opcional y el DAO; el DAO usa el motor. Los datos y errores retornan por las mismas responsabilidades, sin SQL en la vista.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#405a70"/></marker></defs><rect width="720" height="305" rx="16" fill="#f7fafc"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="24" y="32" font-size="21" font-weight="700">MVC, servicio y acceso a datos</text><path d="M219 106L262 106" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><path d="M457 106L500 106" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><path d="M597 143L597 202" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><path d="M500 238L457 238" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><path d="M262 238L219 238" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><rect x="24" y="70" width="195" height="73" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="121.5" y="101" text-anchor="middle" font-size="18" font-weight="700">Vista</text><text x="121.5" y="124" text-anchor="middle" font-size="15" font-weight="400">eventos y presentación</text><rect x="262" y="70" width="195" height="73" rx="10" fill="#d6f5e9" stroke="#197658" stroke-width="1.5"/><text x="359.5" y="101" text-anchor="middle" font-size="18" font-weight="700">Controller</text><text x="359.5" y="124" text-anchor="middle" font-size="15" font-weight="400">coordinar interacción</text><rect x="500" y="70" width="195" height="73" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="597.5" y="101" text-anchor="middle" font-size="18" font-weight="700">Service (opcional)</text><text x="597.5" y="124" text-anchor="middle" font-size="15" font-weight="400">reglas de aplicación</text><rect x="500" y="202" width="195" height="73" rx="10" fill="#d6f5e9" stroke="#197658" stroke-width="1.5"/><text x="597.5" y="233" text-anchor="middle" font-size="18" font-weight="700">Contrato DAO</text><text x="597.5" y="256" text-anchor="middle" font-size="15" font-weight="400">operaciones de datos</text><rect x="262" y="202" width="195" height="73" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="359.5" y="233" text-anchor="middle" font-size="18" font-weight="700">DAO JDBC</text><text x="359.5" y="256" text-anchor="middle" font-size="15" font-weight="400">SQL y mapeo</text><rect x="24" y="202" width="195" height="73" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="121.5" y="233" text-anchor="middle" font-size="18" font-weight="700">Base de datos</text><text x="121.5" y="256" text-anchor="middle" font-size="15" font-weight="400">filas y restricciones</text></g></svg>
