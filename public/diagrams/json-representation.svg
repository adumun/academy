<svg xmlns="http://www.w3.org/2000/svg" width="720" height="245" viewBox="0 0 720 245" role="img" aria-labelledby="t d"><title id="t">De un valor a texto JSON</title><desc id="d">Un registro con sensor A y valor 21 se serializa a un documento JSON; al deserializar se reconstruyen valores que después deben validarse.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#405a70"/></marker></defs><rect width="720" height="245" rx="16" fill="#f7fafc"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="24" y="32" font-size="21" font-weight="700">De un valor a texto JSON</text><path d="M212 148L266 148" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><path d="M454 148L508 148" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><rect x="24" y="90" width="188" height="115" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="118" y="130.5" text-anchor="middle" font-size="18" font-weight="700">Datos en memoria</text><text x="118" y="153.5" text-anchor="middle" font-size="15" font-weight="400">sensor: A</text><text x="118" y="176.5" text-anchor="middle" font-size="15" font-weight="400">valor: 21</text><rect x="266" y="90" width="188" height="115" rx="10" fill="#d6f5e9" stroke="#197658" stroke-width="1.5"/><text x="360" y="130.5" text-anchor="middle" font-size="18" font-weight="700">Texto JSON</text><text x="360" y="153.5" text-anchor="middle" font-size="15" font-weight="400">{"sensor":"A",</text><text x="360" y="176.5" text-anchor="middle" font-size="15" font-weight="400">"valor":21}</text><rect x="508" y="90" width="188" height="115" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="602" y="130.5" text-anchor="middle" font-size="18" font-weight="700">Datos reconstruidos</text><text x="602" y="153.5" text-anchor="middle" font-size="15" font-weight="400">sensor: A</text><text x="602" y="176.5" text-anchor="middle" font-size="15" font-weight="400">valor: 21</text></g></svg>
