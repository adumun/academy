<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" role="img" aria-labelledby="t d"><title id="t">Propagar hasta poder tratar</title><desc id="d">main llama a calcular, que llama a convertir. Si convertir lanza NumberFormatException, el flujo normal se interrumpe y la excepción se propaga hasta el catch compatible de main.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#405a70"/></marker></defs><rect width="720" height="310" rx="16" fill="#f7fafc"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="24" y="32" font-size="21" font-weight="700">Propagar hasta poder tratar</text><path d="M234 102L255 102" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><path d="M465 102L486 102" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><path d="M591 140L591 208" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><path d="M486 245L234 245" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><text x="360" y="237" text-anchor="middle" font-size="14" paint-order="stroke" stroke="#f7fafc" stroke-width="5">propagación</text><rect x="24" y="65" width="210" height="75" rx="10" fill="#d6f5e9" stroke="#197658" stroke-width="1.5"/><text x="129" y="97" text-anchor="middle" font-size="18" font-weight="700">main</text><text x="129" y="120" text-anchor="middle" font-size="15" font-weight="400">try / catch</text><rect x="255" y="65" width="210" height="75" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="360" y="108.5" text-anchor="middle" font-size="18" font-weight="700">calcular()</text><rect x="486" y="65" width="210" height="75" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="591" y="97" text-anchor="middle" font-size="18" font-weight="700">convertir()</text><text x="591" y="120" text-anchor="middle" font-size="15" font-weight="400">parseInt</text><rect x="486" y="208" width="210" height="75" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="591" y="240" text-anchor="middle" font-size="18" font-weight="700">Excepción</text><text x="591" y="263" text-anchor="middle" font-size="15" font-weight="400">formato inválido</text><rect x="24" y="208" width="210" height="75" rx="10" fill="#d6f5e9" stroke="#197658" stroke-width="1.5"/><text x="129" y="240" text-anchor="middle" font-size="18" font-weight="700">catch</text><text x="129" y="263" text-anchor="middle" font-size="15" font-weight="400">tratar el fallo</text></g></svg>
