<svg xmlns="http://www.w3.org/2000/svg" width="720" height="296" viewBox="0 0 720 296" role="img" aria-labelledby="t d"><title id="t">Estado e identidad de objetos</title><desc id="d">Dos contadores distintos comienzan con valor cero. Incrementar solo el contador A cambia su valor a uno y conserva el estado del contador B.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#405a70"/></marker></defs><rect width="720" height="296" rx="16" fill="#f7fafc"/><g font-family="system-ui, sans-serif" fill="#183149"><text x="24" y="32" font-size="21" font-weight="700">Estado e identidad de objetos</text><path d="M259 107 L461 107" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#arrow)"/><text x="360" y="99" text-anchor="middle" font-size="14" paint-order="stroke" stroke="#f7fafc" stroke-width="5" fill="#334e64">incrementar A</text><path d="M259 229 L461 229" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#arrow)"/><text x="360" y="221" text-anchor="middle" font-size="14" paint-order="stroke" stroke="#f7fafc" stroke-width="5" fill="#334e64">sin cambios</text><rect x="24" y="68" width="235" height="79" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.6"/><text x="141.5" y="102" text-anchor="middle" font-size="18" font-weight="700">Contador A</text><text x="141.5" y="125" text-anchor="middle" font-size="15" font-weight="400">valor = 0</text><rect x="24" y="190" width="235" height="79" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.6"/><text x="141.5" y="224" text-anchor="middle" font-size="18" font-weight="700">Contador B</text><text x="141.5" y="247" text-anchor="middle" font-size="15" font-weight="400">valor = 0</text><rect x="461" y="68" width="235" height="79" rx="10" fill="#d6f5e9" stroke="#197658" stroke-width="1.6"/><text x="578.5" y="102" text-anchor="middle" font-size="18" font-weight="700">Contador A</text><text x="578.5" y="125" text-anchor="middle" font-size="15" font-weight="400">valor = 1</text><rect x="461" y="190" width="235" height="79" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.6"/><text x="578.5" y="224" text-anchor="middle" font-size="18" font-weight="700">Contador B</text><text x="578.5" y="247" text-anchor="middle" font-size="15" font-weight="400">valor = 0</text></g></svg>
