<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" role="img" aria-labelledby="t d"><title id="t">Un array tiene posiciones fijas</title><desc id="d">La variable mediciones referencia un array de tres elementos. Los índices 0, 1 y 2 contienen 10, 20 y 30; length vale 3.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#405a70"/></marker></defs><rect width="720" height="290" rx="16" fill="#f7fafc"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="24" y="32" font-size="21" font-weight="700">Un array tiene posiciones fijas</text><path d="M139 135L139 200" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><rect x="24" y="65" width="230" height="70" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="139" y="94.5" text-anchor="middle" font-size="18" font-weight="700">mediciones</text><text x="139" y="117.5" text-anchor="middle" font-size="15" font-weight="400">referencia al array</text><rect x="24" y="200" width="210" height="64" rx="10" fill="#d6f5e9" stroke="#197658" stroke-width="1.5"/><text x="129" y="226.5" text-anchor="middle" font-size="18" font-weight="700">índice 0</text><text x="129" y="249.5" text-anchor="middle" font-size="15" font-weight="400">10</text><rect x="255" y="200" width="210" height="64" rx="10" fill="#d6f5e9" stroke="#197658" stroke-width="1.5"/><text x="360" y="226.5" text-anchor="middle" font-size="18" font-weight="700">índice 1</text><text x="360" y="249.5" text-anchor="middle" font-size="15" font-weight="400">20</text><rect x="486" y="200" width="210" height="64" rx="10" fill="#d6f5e9" stroke="#197658" stroke-width="1.5"/><text x="591" y="226.5" text-anchor="middle" font-size="18" font-weight="700">índice 2</text><text x="591" y="249.5" text-anchor="middle" font-size="15" font-weight="400">30</text></g></svg>
