<svg xmlns="http://www.w3.org/2000/svg" width="720" height="295" viewBox="0 0 720 295" role="img" aria-labelledby="t d"><title id="t">Vincular parámetros por posición</title><desc id="d">En UPDATE, el marcador 1 corresponde a titulo y recibe setString; el marcador 2 corresponde a id y recibe setInt. El driver ejecuta la estructura SQL con los valores vinculados.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#405a70"/></marker></defs><rect width="720" height="295" rx="16" fill="#f7fafc"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="24" y="32" font-size="21" font-weight="700">Vincular parámetros por posición</text><path d="M174 190L369 125" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><path d="M546 190L522 125" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><rect x="95" y="55" width="530" height="70" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="360" y="96" text-anchor="middle" font-size="18" font-weight="700">UPDATE libro SET titulo = ? WHERE id = ?</text><rect x="24" y="190" width="300" height="74" rx="10" fill="#d6f5e9" stroke="#197658" stroke-width="1.5"/><text x="174" y="221.5" text-anchor="middle" font-size="18" font-weight="700">Parámetro 1</text><text x="174" y="244.5" text-anchor="middle" font-size="15" font-weight="400">setString(1, "Java")</text><rect x="396" y="190" width="300" height="74" rx="10" fill="#d6f5e9" stroke="#197658" stroke-width="1.5"/><text x="546" y="221.5" text-anchor="middle" font-size="18" font-weight="700">Parámetro 2</text><text x="546" y="244.5" text-anchor="middle" font-size="15" font-weight="400">setInt(2, 7)</text></g></svg>
