<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="t d"><title id="t">Hash no es identidad</title><desc id="d">Dos objetos Coordenada con valores 2,3 son instancias distintas pero iguales. Comparten hash; otro objeto con el mismo hash podría no ser igual.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#405a70"/></marker></defs><rect width="720" height="300" rx="16" fill="#f7fafc"/><g font-family="system-ui,sans-serif" fill="#183149"><text x="24" y="32" font-size="21" font-weight="700">Hash no es identidad</text><path d="M284 102L436 149" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><path d="M284 237L436 185" fill="none" stroke="#405a70" stroke-width="2.3" marker-end="url(#a)"/><rect x="24" y="65" width="260" height="74" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="154" y="96.5" text-anchor="middle" font-size="18" font-weight="700">Objeto A</text><text x="154" y="119.5" text-anchor="middle" font-size="15" font-weight="400">Coordenada(2,3)</text><rect x="24" y="200" width="260" height="74" rx="10" fill="#e7eff7" stroke="#587990" stroke-width="1.5"/><text x="154" y="231.5" text-anchor="middle" font-size="18" font-weight="700">Objeto B</text><text x="154" y="254.5" text-anchor="middle" font-size="15" font-weight="400">Coordenada(2,3)</text><rect x="436" y="115" width="260" height="104" rx="10" fill="#d6f5e9" stroke="#197658" stroke-width="1.5"/><text x="566" y="150" text-anchor="middle" font-size="18" font-weight="700">Mismo hash</text><text x="566" y="173" text-anchor="middle" font-size="15" font-weight="400">candidatos</text><text x="566" y="196" text-anchor="middle" font-size="15" font-weight="400">equals confirma</text></g></svg>
